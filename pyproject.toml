[project]
name = "item-bench"
version = "0.1.0"
description = "LLM assessment-item generator with a deterministic quality-scoring harness"
readme = "README.md"
authors = [
    { name = "Danilo M. Silva", email = "68205719+danilomsilva@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
